[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrogis"
version = "1.0.0"
description = "Hydro-GIS Digital Twin - Flood risk assessment and hydrological analysis"
authors = [
    { name = "Hydro-GIS Team" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "rasterio>=1.3",
    "numpy>=1.21",
    "scipy>=1.7",
    "PyYAML>=6.0",
    "whitebox>=2.3",
    "geopandas>=0.10",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.950",
]
streamlit = [
    "streamlit>=1.20",
    "folium>=0.14",
    "streamlit-folium>=0.10",
    "plotly>=5.0",
    "matplotlib>=3.5",
]
gee = [
    "earthengine-api>=0.1",
    "geemap>=0.20",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hydrogis*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
